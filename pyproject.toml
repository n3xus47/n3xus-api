[project]
name = "n3xus-api"
version = "0.2.0"
description = "Local, self-hosted real-world tools API"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "ddgs>=9.0",
  "docker>=7.1",
  "fastapi>=0.115",
  "faster-whisper>=1.1",
  "httpx>=0.28",
  "markdownify>=1.1",
  "pydantic-settings>=2.7",
  "pypdf>=5.0",
  "playwright>=1.51",
  "readability-lxml>=0.8.1",
  "youtube-transcript-api>=1.2",
  "yt-dlp>=2025.1",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
