use_default_settings: true
server:
  secret_key: "change-this-before-sharing"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
search:
  safe_search: 0
  formats:
    - html
    - json
  default_lang: "en"
outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0

# Keep the configured search chain on engines verified in the local network.
engines:
  - name: duckduckgo
    disabled: true
    weight: 0.1
  - name: brave
    disabled: false
    weight: 1.0
  - name: google
    disabled: true
  - name: bing
    disabled: false
    weight: 2.0
  - name: startpage
    disabled: true
    weight: 1.0
