services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      N3XUS_API_SEARXNG_URL: http://searxng:8080
      N3XUS_API_VM_HOST_DATA_DIR: ${PWD}/data
    volumes:
      - ./data:/app/data
      # VM runs are explicitly trusted localhost calls. This grants Docker-host control.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      searxng:
        condition: service_started

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng:ro

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
